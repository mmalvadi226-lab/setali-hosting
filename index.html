<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SetaLi Hosting</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #0b1010;
  color: #ecfdf5;
  font-family: Arial, sans-serif;
}

header {
  background: #101b18;
  padding: 20px;
  border-bottom: 1px solid #244b3a;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #4ade80;
}

.badge {
  background: #153b2b;
  color: #86efac;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
}

.layout {
  display: flex;
  min-height: calc(100vh - 75px);
}

nav {
  width: 210px;
  background: #101816;
  padding: 20px 12px;
  border-right: 1px solid #263a32;
}

nav button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  color: #a7b8af;
  border: 0;
  padding: 13px;
  margin-bottom: 7px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

nav button.active,
nav button:hover {
  background: #173c2b;
  color: #86efac;
}

main {
  flex: 1;
  padding: 25px;
  min-width: 0;
}

h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.subtitle {
  color: #91a59a;
  margin-bottom: 24px;
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
  margin-bottom: 22px;
}

.card {
  background: #111b17;
  border: 1px solid #263b31;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
}

.card h3 {
  font-size: 14px;
  color: #a8b8af;
  margin-bottom: 14px;
}

.value {
  font-size: 25px;
  font-weight: bold;
}

.green {
  color: #4ade80;
}

.muted {
  color: #8da197;
  font-size: 13px;
  margin-top: 8px;
}

.server {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.server-name {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 8px;
}

.status {
  color: #4ade80;
  font-size: 13px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  border: 0;
  border-radius: 7px;
  padding: 11px 15px;
  font-weight: bold;
  cursor: pointer;
  color: #06140c;
  background: #4ade80;
}

.btn.stop {
  background: #fb7185;
}

.btn.secondary {
  background: #263b31;
  color: #e5f5eb;
}

.btn:active {
  transform: scale(.97);
}

.console {
  background: #050908;
  color: #86efac;
  font-family: monospace;
  font-size: 13px;
  padding: 15px;
  border-radius: 8px;
  min-height: 150px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.8;
}

input {
  background: #080e0b;
  border: 1px solid #314b3c;
  border-radius: 7px;
  padding: 12px;
  color: white;
  width: 100%;
  margin: 10px 0;
}

.hidden {
  display: none;
}

footer {
  color: #62766a;
  text-align: center;
  padding: 20px;
  font-size: 12px;
}

@media (max-width: 650px) {
  .layout {
    display: block;
  }
